<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محطة إنتاج المياه</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#062a44;--fg:#eaf6ff;--mut:#9fc6df;--acc:#17b3a3;--glass:rgba(255,255,255,.08);--sz:clamp(84px,17svh,140px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-snap-type:y mandatory;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#062a44,#0a3d5f 50%,#062a44)}
body{color:var(--fg);font-family:'Tajawal',Tahoma,Arial,sans-serif}
#pg{position:fixed;top:env(safe-area-inset-top,0px);right:0;height:3px;width:0;background:var(--acc);z-index:5}
#nv{position:fixed;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:5}
#nv b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}
#nv b.a{background:var(--acc);height:20px;border-radius:4px}
.sl{position:relative;z-index:1;min-height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:26px 28px 26px 22px;background:radial-gradient(circle at 85% 8%,color-mix(in srgb,var(--acc) 24%,transparent),transparent 55%)}
h1{font-size:34px;font-weight:800;line-height:1.3}
h2{font-size:26px;font-weight:800;line-height:1.3}
.sub{color:var(--mut);font-size:17px;margin-top:4px}
.ttl{display:inline-block;font-size:26px;font-weight:800;border-bottom:3px solid var(--acc);padding-bottom:6px;align-self:flex-start}
.it{display:flex;align-items:center}
.it.alt{flex-direction:row-reverse}
.img{flex:0 0 var(--sz);height:var(--sz);border-radius:20px;border:2px solid color-mix(in srgb,var(--acc) 70%,transparent);background:var(--glass);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 24px color-mix(in srgb,var(--acc) 35%,transparent);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;overflow:hidden;opacity:0;transform:scale(.4) rotate(-8deg);transition:opacity .5s,transform .8s cubic-bezier(.34,1.56,.64,1);transition-delay:var(--d,0s)}
.img img{width:100%;height:100%;object-fit:cover}
.pic{width:100%;height:clamp(120px,22svh,220px);border-radius:20px;border:2px solid color-mix(in srgb,var(--acc) 70%,transparent);background:var(--glass);box-shadow:0 8px 22px rgba(0,0,0,.4),0 0 22px color-mix(in srgb,var(--acc) 30%,transparent);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;overflow:hidden;opacity:0;transform:translateY(-26px) scale(.96);transition:opacity .6s,transform .8s cubic-bezier(.34,1.3,.64,1)}
.pic img{width:100%;height:100%;object-fit:cover}
.big{display:flex;flex-direction:column;gap:18px}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:980px;margin-inline:auto}
.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;border-radius:20px;background:var(--glass);border:1.5px solid color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 6px 16px rgba(0,0,0,.3);opacity:0;transform:translateY(22px);transition:.6s ease;transition-delay:var(--d,0s)}
.tile.on{opacity:1;transform:none}
.tile svg{width:34%;max-width:60px;color:var(--acc)}
.tile .tt{font-size:14px;font-weight:700;line-height:1.35}
.tile .v{display:flex;flex-direction:column;align-items:center}
.tile .n,.tile .t{font-size:26px;font-weight:800;color:var(--acc);line-height:1.15}
.tile .v small{font-size:13px;color:var(--mut);unicode-bidi:plaintext}
@media(min-width:760px){.gr{grid-template-columns:repeat(4,1fr);gap:18px}.tile .tt{font-size:17px}.tile .n,.tile .t{font-size:32px}.tile .v small{font-size:15px}}
.ul{display:inline-block;border-bottom:3px solid var(--acc);padding-bottom:6px}
.big .pic{height:min(38svh,320px)}
.txt{opacity:0;transform:translateY(22px);transition:.7s ease;transition-delay:var(--d,0s)}
.pic.on,.txt.on{opacity:1;transform:none}
.cn{position:relative;flex:0 0 clamp(36px,13vw,90px);height:var(--sz)}
.alt .cn{transform:scaleX(-1)}
.cn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;clip-path:inset(0 0 0 100%);transition:clip-path .7s ease;transition-delay:calc(var(--d,0s) + .45s)}
.cn path{fill:none;stroke:var(--acc);stroke-width:2.5;vector-effect:non-scaling-stroke}
.cn i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);transform:translate(-50%,-50%) scale(0);transition:transform .4s;transition-delay:calc(var(--d,0s) + .4s)}
.cn .d1{right:0;top:25%;transform:translate(50%,-50%) scale(0)}
.cn .d2{left:0;top:50%;transition-delay:calc(var(--d,0s) + 1s)}
.lb{flex:1;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 16px;opacity:0;transform:translateX(60px);transition:.7s ease;transition-delay:calc(var(--d,0s) + .5s)}
.lb b{font-size:19px;display:block}.lb small{display:block;color:var(--mut);font-size:15px;margin-top:2px}
.lb .num{font-size:34px;color:var(--acc);font-weight:800;line-height:1}
.on .img{opacity:1;transform:none}
.on .cn svg{clip-path:inset(0)}
.on .cn .d1{transform:translate(50%,-50%) scale(1)}.on .cn .d2{transform:translate(-50%,-50%) scale(1)}
.on .lb{opacity:1;transform:none}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h3{font-size:18px;color:var(--acc)}
.row{display:flex;align-items:baseline;justify-content:space-between;background:var(--glass);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 16px;opacity:0;transform:translateY(22px);transition:.7s ease;transition-delay:var(--d)}
.row.on{opacity:1;transform:none}
.row .l{color:var(--mut);font-size:16px}
.n{font-weight:800;font-variant-numeric:tabular-nums}
.t{font-weight:800;font-size:22px;}
.u{font-size:14px;color:var(--mut);margin-inline-start:6px}
.row .n, .row .t{font-size:28px}
.r0 .n, .r0 .t{font-size:44px;color:var(--acc);text-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent)}
.two{display:grid;gap:12px}
.tbs{background:var(--glass);border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden}
.tbh{display:flex;justify-content:space-between;background:color-mix(in srgb,var(--acc) 30%,transparent);padding:8px 14px;font-weight:800;font-size:16px}
.tbr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid rgba(255,255,255,.08)}
.tbr b{display:block;font-size:17px}
.tbr small{display:block;color:var(--mut);font-size:15px}
.tbr em{font-style:normal;font-weight:800;font-size:22px;color:var(--acc);min-width:28px;text-align:center}
.tbs{opacity:0}
.tbs.on{opacity:1;animation:tin .6s ease both;animation-delay:var(--d)}
@keyframes tin{from{opacity:0;transform:translateY(22px)}}
.cards{display:flex;flex-direction:column;gap:14px}
@media(max-width:759px){.lb{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.12)}.img{box-shadow:0 6px 16px rgba(0,0,0,.35)}}
@media(min-width:760px){.sl{padding:40px 14vw}.two{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.img,.lb,.row,.tbs,.pic,.txt,.tile{opacity:1;transform:none}.cn svg{clip-path:none}.cn i{transform:translate(-50%,-50%)}}
#logo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;height:58px;width:auto;max-width:46vw;object-fit:contain;z-index:6;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.sl{padding-top:84px}
@media(min-width:760px){#logo{height:84px;top:16px;right:24px}.sl{padding-top:116px}}
.sl:last-of-type{align-items:center;text-align:center}
.sl:last-of-type .big{align-items:center}
.sl:last-of-type h1{font-size:38px}	
</style>
</head>

const m=document.getElementById('m');
m.innerHTML=S.map(x=>{let b;
if(x.k=='t')b=`<div class="big">${x.img?`<div class="pic">${P(x.img)}</div>`:''}<div class="txt" style="--d:.2s"><h1 class="ul">${x.h}</h1><p class="sub">${x.s}</p></div></div>`;
else if(x.k=='g')b=`<div class="txt" style="--d:.1s"><h2 class="ttl">${x.h}</h2></div><div class="gr">`+x.g.map((r,i)=>`<div class="tile" style="--d:${.1+i*.08}s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[r[0]]||IC.chart}</svg><span class="tt">${r[1]}</span>${r[2]!==undefined?`<div class="v"><span class="${typeof r[2]=='number'?'n':'t'}" data-v="${r[2]}">${typeof r[2]=='number'?0:r[2]}</span>${r[3]?`<small>${r[3]}</small>`:''}</div>`:''}</div>`).join('')+'</div>';
else if(x.k=='tb')b=`<h2 class="ttl">${x.h}</h2>`+x.sec.map((g,i)=>`<div class="tbs" style="--d:.1s"><div class="tbh"><span>${g.h}</span><span>العدد</span></div>`+g.r.map(r=>`<div class="tbr"><div><b>${r[0]}</b><small>${r[1]}</small></div><em>${r[2]}</em></div>`).join('')+'</div>').join('');
else if(x.k=='s')b=(x.img?`<div class="pic">${P(x.img)}</div>`:'')+`<div class="txt" style="--d:.15s"><h2 class="ttl">${x.h}</h2>${x.s?`<p class="sub">الوحدة: ${x.s}</p>`:''}</div>`+`<div class="${x.two?'two':''}">`+x.g.map(g=>`<div class="grp">${g.h?`<h3>${g.h}</h3>`:''}`+g.r.map((r,i)=>`<div class="row r${i}" style="--d:${.1+i*.15}s"><span class="l">${r[0]}</span> <span>  <span class="${typeof r[1]=='number'?'n':'t'}" data-v="${r[1]}" data-raw="${r[3]|| ''}">${typeof r[1]=='number'?0:r[1]}</span><span class="u">${typeof r[1]=='number'?(r[2]||x.s):''}</span></span></div>`).join('')+'</div>').join('')+'</div>';
else b=`<h2 class="ttl">${x.h}</h2><div class="cards">`+x.c.map((c,i)=>it(i,c[3],`<span class="num">${c[0]}</span><b>${c[1]}</b>${c[2]?`<small>${c[2]}</small>`:''}`,.05)).join('')+'</div>';
return `<section class="sl${x.k=='c'||x.k=='tb'?' tall':''}" style="--acc:${x.a}">${b}</section>`}).join('');
const secs=[...document.querySelectorAll('.sl')];
const nv=document.getElementById('nv');nv.innerHTML=secs.map(()=>'<b></b>').join('');
const ease=t=>1-Math.pow(1-t,3);
function count(el){if(!el.closest('.on'))return;const v=+el.dataset.v,d=dc(v),s=performance.now();(function st(n){if(!el.closest('.on'))return;const p=Math.min((n-s)/1800,1);el.textContent=el.dataset.raw?Math.round(v*ease(p)):f(v*ease(p),d);if(p<1)requestAnimationFrame(st)})(s)}
const io=new IntersectionObserver(es=>es.forEach(e=>{const t=e.target;
if(e.isIntersecting){t.classList.add('on');t.querySelectorAll('.n').forEach(n=>setTimeout(()=>count(n),350))}
else{t.classList.remove('on');t.querySelectorAll('.n').forEach(n=>n.textContent='0')}}),{threshold:.25,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.it,.row,.tbs,.pic,.txt,.tile').forEach(x=>io.observe(x));
const so=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;
document.documentElement.style.setProperty('--acc',getComputedStyle(t).getPropertyValue('--acc'));
[...nv.children].forEach((d,i)=>d.classList.toggle('a',secs[i]===t))}),{rootMargin:'-45% 0px -45% 0px'});
secs.forEach(x=>so.observe(x));
const tall=secs.filter(t=>t.classList.contains('tall'));let mode='';
function snapMode(){const h=innerHeight/2;const inT=tall.some(t=>{const r=t.getBoundingClientRect();return r.top<=h&&r.bottom>=h});const m=inT?'none':'y mandatory';if(m!==mode){mode=m;document.documentElement.style.scrollSnapType=m}}
snapMode();
addEventListener('scroll',()=>{snapMode();const d=document.documentElement;document.getElementById('pg').style.width=(scrollY/Math.max(1,d.scrollHeight-innerHeight)*100)+'%'},{passive:true});
</script>
